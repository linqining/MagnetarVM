[package]
name = "magnetar-pcs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bincode.workspace = true
ligerito = { path = "../../vendor/ligerito", default-features = false, features = ["std", "prover", "parallel", "hardware-accel", "transcript-sha256", "serde"] }
ligerito-binary-fields = { path = "../../vendor/ligerito-binary-fields", default-features = false, features = ["std"] }
p3-binary-field = { path = "../../vendor/plonky3/binary-field" }
