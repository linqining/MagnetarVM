p3-field = { path = "../../vendor/plonky3/field" }
p3-keccak = { path = "../../vendor/plonky3/keccak" }
p3-matrix = { path = "../../vendor/plonky3/matrix" }
p3-merkle-tree = { path = "../../vendor/plonky3/merkle-tree" }
p3-multilinear-util = { path = "../../vendor/plonky3/multilinear-util" }
p3-sumcheck = { path = "../../vendor/plonky3/sumcheck" }
p3-symmetric = { path = "../../vendor/plonky3/symmetric" }
magnetar-proof.workspace = true
magnetar-transcript.workspace = true
magnetar-constraint.workspace = true
serde.workspace = true
thiserror.workspace = true
ark-bn254 = "0.3"
