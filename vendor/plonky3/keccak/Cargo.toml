[package]
name = "p3-keccak"
description = "An optimized implementation of the Keccak-f permutation and the Keccak-256 and SHA3-256 hash functions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Criterion pulls Rayon transitively, which does not build for WASI.
[target.'cfg(target_arch = "x86_64")'.dependencies]
cpufeatures.workspace = true

[dependencies]
p3-symmetric.workspace = true
p3-util.workspace = true

tiny-keccak = { workspace = true, features = ["keccak", "sha3"] }

[lints]
workspace = true

