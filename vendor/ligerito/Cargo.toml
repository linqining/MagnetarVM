[package]
name = "ligerito"
version = "0.8.0"
edition = "2021"
authors = ["rotko networks"]
license = "MIT"
description = "Ligerito polynomial commitment scheme over binary extension fields"
repository = "https://github.com/rotkonetworks/ligerito"
build = "build.rs"

autotests = false
autobenches = false
autoexamples = false
autobins = false

[features]
default = ["std", "prover", "parallel", "hardware-accel", "transcript-sha256"]
std = [
    "ligerito-binary-fields/std",
    "ligerito-merkle/std",
    "ligerito-reed-solomon?/std",
    "dep:serde",
    "serde?/std",
    "dep:thiserror",
]
prover = [
    "dep:ligerito-reed-solomon",
    "dep:rand",
    "dep:rand_chacha",
    "ligerito-binary-fields/rand",
    "ligerito-merkle/rand",
]
parallel = [
    "dep:rayon",
    "ligerito-reed-solomon?/parallel",
    "ligerito-merkle/parallel",
]
hardware-accel = [
    "ligerito-binary-fields/hardware-accel",
    "ligerito-reed-solomon?/hardware-accel",
]
op-count = [
    "ligerito-binary-fields/op-count",
    "ligerito-merkle/op-count",
]
serde = [
    "dep:serde",
    "ligerito-binary-fields/serde",
    "ligerito-merkle/serde",
]
transcript-sha256 = []
verifier-only = []
scale = []

[dependencies]
bytemuck = { version = "1", features = ["extern_crate_alloc"], default-features = false }
hashbrown = { version = "0.14", default-features = false }
ligerito-binary-fields = { path = "../ligerito-binary-fields", version = "0.7.2", default-features = false }
ligerito-merkle = { path = "../ligerito-merkle", version = "0.7.1", default-features = false }
ligerito-reed-solomon = { path = "../ligerito-reed-solomon", version = "0.7.0", optional = true, default-features = false }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
rayon = { version = "1.8", optional = true }
serde = { version = "1.0", features = ["derive", "alloc"], optional = true, default-features = false }
sha2 = "0.10"
thiserror = { version = "1.0", optional = true }

[lib]
name = "ligerito"
crate-type = ["rlib"]
path = "src/lib.rs"

