[workspace]
resolver = "2"
exclude = [
    "vendor/plonky3",
    "vendor/ligerito",
    "vendor/ligerito-binary-fields",
    "vendor/ligerito-merkle",
    "vendor/ligerito-reed-solomon",
    "vendor/wide",
    "vendor/safe_arch",
    "vendor/miniz_oxide",
    "vendor/adler2",
]
members = [
    "crates/magnetar-spec",
    "crates/magnetar-guest",
    "crates/magnetar-preprocess",
    "crates/magnetar-executor",
    "crates/magnetar-constraint",
    "crates/magnetar-cpu",
    "crates/magnetar-memory",
    "crates/magnetar-routing",
    "crates/magnetar-proof",
    "crates/magnetar-pcs",
    "crates/magnetar-transcript",
    "crates/magnetar-runtime",
    "crates/magnetar-recursion",
    "crates/magnetar-privacy",
    "crates/magnetar-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bincode = "1.3"
criterion = { version = "0.5", features = ["html_reports"] }
goblin = "0.8"
lambdaworks-math = { version = "0.13", default-features = false, features = ["std"] }
proptest = "1.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"

magnetar-spec = { path = "crates/magnetar-spec" }
magnetar-guest = { path = "crates/magnetar-guest" }
magnetar-preprocess = { path = "crates/magnetar-preprocess" }
magnetar-executor = { path = "crates/magnetar-executor" }
magnetar-constraint = { path = "crates/magnetar-constraint" }
magnetar-cpu = { path = "crates/magnetar-cpu" }
magnetar-memory = { path = "crates/magnetar-memory" }
magnetar-routing = { path = "crates/magnetar-routing" }
magnetar-proof = { path = "crates/magnetar-proof" }
magnetar-pcs = { path = "crates/magnetar-pcs" }
magnetar-transcript = { path = "crates/magnetar-transcript" }
magnetar-runtime = { path = "crates/magnetar-runtime" }
magnetar-recursion = { path = "crates/magnetar-recursion" }
magnetar-privacy = { path = "crates/magnetar-privacy" }
magnetar-testkit = { path = "crates/magnetar-testkit" }

[profile.release]
lto = "thin"
codegen-units = 1

# Debug test builds spend most of their time inside the vendored PCS and
# field-arithmetic dependencies. Optimize dependencies without giving up
# debug info or incremental builds for the workspace crates.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
